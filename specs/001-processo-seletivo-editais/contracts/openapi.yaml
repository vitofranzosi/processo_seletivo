openapi: 3.1.0
info:
  title: Processo Seletivo e Editais API
  version: 1.0.0-draft
  description: Contrato de planejamento; não representa implementação existente.
servers:
  - url: /api/v1
tags:
  - name: Processos administrativos
  - name: Editais administrativos
  - name: Retificações administrativas
  - name: Consulta pública
  - name: Auditoria
paths:
  /admin/processos:
    post:
      tags: [Processos administrativos]
      summary: Criar Processo Seletivo e primeiro Edital atomicamente
      operationId: criarProcessoComPrimeiroEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarProcessoRequest' }
      responses:
        '201':
          description: Processo e Edital criados
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProcessoResponse' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/processos/{processoId}/editais:
    post:
      tags: [Editais administrativos]
      summary: Criar outro Edital independente no Processo
      operationId: criarEdital
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProcessoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriarEditalRequest' } } }
      responses:
        '201': { description: Edital criado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/processos/{processoId}/ativacoes:
    post:
      tags: [Processos administrativos]
      summary: Ativar Processo Seletivo por ato administrativo
      operationId: ativarProcesso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProcessoId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtoAdministrativoRequest' } } }
      responses:
        '200': { description: Processo ativado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/processos/{processoId}/encerramentos:
    post:
      tags: [Processos administrativos]
      summary: Encerrar regularmente Processo Seletivo
      operationId: encerrarProcesso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProcessoId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtoAdministrativoRequest' } } }
      responses:
        '200': { description: Processo encerrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/processos/{processoId}/cancelamentos:
    post:
      tags: [Processos administrativos]
      summary: Cancelar Processo Seletivo por ato motivado
      operationId: cancelarProcesso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProcessoId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelamentoRequest' } } }
      responses:
        '200': { description: Processo cancelado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/rascunho:
    put:
      tags: [Editais administrativos]
      summary: Substituir a configuração estruturada do rascunho
      operationId: atualizarRascunhoEdital
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EditalId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditalDraftRequest' } } }
      responses:
        '200': { description: Rascunho atualizado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/submissoes:
    post:
      tags: [Editais administrativos]
      summary: Submeter Edital para revisão
      operationId: submeterEdital
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EditalId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Edital submetido, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/homologacoes:
    post:
      tags: [Editais administrativos]
      summary: Homologar a revisão submetida do Edital
      operationId: homologarEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EditalId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomologacaoRequest' } } }
      responses:
        '200': { description: Edital homologado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/revogacoes-homologacao:
    post:
      tags: [Editais administrativos]
      summary: Revogar homologação antes da Publicação
      operationId: revogarHomologacaoEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EditalId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MotivoRequest' } } }
      responses:
        '200': { description: Homologação revogada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/publicacoes:
    post:
      tags: [Editais administrativos]
      summary: Publicar a revisão homologada do Edital
      operationId: publicarEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EditalId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicacaoRequest' } } }
      responses:
        '201': { description: Publicação criada, headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicacaoResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/encerramentos:
    post:
      tags: [Editais administrativos]
      summary: Encerrar regularmente Edital publicado
      operationId: encerrarEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EditalId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtoAdministrativoRequest' } } }
      responses:
        '200': { description: Edital encerrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/cancelamentos:
    post:
      tags: [Editais administrativos]
      summary: Cancelar Edital por ato motivado
      operationId: cancelarEdital
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EditalId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelamentoRequest' } } }
      responses:
        '200': { description: Edital cancelado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EditalAdminResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/editais/{editalId}/retificacoes:
    post:
      tags: [Retificações administrativas]
      summary: Criar Retificação em elaboração
      operationId: criarRetificacao
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EditalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriarRetificacaoRequest' } } }
      responses:
        '201': { description: Retificação criada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/retificacoes/{retificacaoId}/rascunho:
    put:
      tags: [Retificações administrativas]
      summary: Substituir as alterações estruturadas da Retificação em elaboração
      operationId: atualizarRascunhoRetificacao
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RetificacaoId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarRetificacaoRequest' } } }
      responses:
        '200': { description: Rascunho atualizado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/retificacoes/{retificacaoId}/submissoes:
    post:
      tags: [Retificações administrativas]
      summary: Submeter Retificação para revisão
      operationId: submeterRetificacao
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RetificacaoId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Retificação submetida, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/retificacoes/{retificacaoId}/homologacoes:
    post:
      tags: [Retificações administrativas]
      summary: Homologar Retificação submetida
      operationId: homologarRetificacao
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RetificacaoId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomologacaoRequest' } } }
      responses:
        '200': { description: Retificação homologada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/retificacoes/{retificacaoId}/publicacoes:
    post:
      tags: [Retificações administrativas]
      summary: Publicar Retificação homologada
      operationId: publicarRetificacao
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RetificacaoId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicacaoRequest' } } }
      responses:
        '201': { description: Retificação publicada, headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicacaoResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/retificacoes/{retificacaoId}/devolucoes:
    post:
      tags: [Retificações administrativas]
      summary: Devolver Retificação para elaboração antes da Publicação
      description: >-
        Retorno para correção admitido a partir de Em revisão ou Homologada, conforme a FR-027.
        Desfaz a homologação e exige motivo. Publicada e Cancelada são finais.
      operationId: devolverRetificacao
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RetificacaoId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MotivoRequest' } } }
      responses:
        '200': { description: Retificação devolvida para elaboração, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/retificacoes/{retificacaoId}/cancelamentos:
    post:
      tags: [Retificações administrativas]
      summary: Cancelar Retificação por ato motivado
      operationId: cancelarRetificacao
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RetificacaoId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelamentoRequest' } } }
      responses:
        '200': { description: Retificação cancelada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /public/editais/{editalId}/versao-vigente:
    get:
      tags: [Consulta pública]
      summary: Consultar conteúdo normativo vigente em um instante
      operationId: consultarVersaoVigente
      parameters:
        - $ref: '#/components/parameters/EditalId'
        - name: em
          in: query
          required: false
          description: Instante ISO-8601; ausência significa agora
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Versão consolidada, content: { application/json: { schema: { $ref: '#/components/schemas/VersaoConsolidadaResponse' } } } }
        '404': { $ref: '#/components/responses/NoEffectiveVersion' }
  /public/editais/{editalId}/historico:
    get:
      tags: [Consulta pública]
      summary: Listar Edital original, Retificações e versões consolidadas
      operationId: listarHistoricoPublico
      parameters:
        - $ref: '#/components/parameters/EditalId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página histórica, content: { application/json: { schema: { $ref: '#/components/schemas/HistoricoPage' } } } }
  /public/publicacoes/{publicacaoId}:
    get:
      tags: [Consulta pública]
      summary: Consultar metadados e conteúdo de uma Publicação imutável
      operationId: consultarPublicacao
      parameters: [{ $ref: '#/components/parameters/PublicacaoId' }]
      responses:
        '200': { description: Publicação histórica, content: { application/json: { schema: { $ref: '#/components/schemas/PublicacaoDetalheResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/retificacoes/{retificacaoId}:
    get:
      tags: [Consulta pública]
      summary: Consultar uma Retificação publicada e suas alterações
      operationId: consultarRetificacaoPublicada
      parameters: [{ $ref: '#/components/parameters/RetificacaoId' }]
      responses:
        '200': { description: Retificação publicada, content: { application/json: { schema: { $ref: '#/components/schemas/RetificacaoPublicaResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/versoes/{versaoId}:
    get:
      tags: [Consulta pública]
      summary: Consultar uma versão consolidada histórica específica
      operationId: consultarVersaoConsolidada
      parameters: [{ $ref: '#/components/parameters/VersaoId' }]
      responses:
        '200': { description: Versão consolidada histórica, content: { application/json: { schema: { $ref: '#/components/schemas/VersaoConsolidadaResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/publicacoes/{publicacaoId}/documento:
    get:
      tags: [Consulta pública]
      summary: Obter os bytes exatos do documento publicado
      operationId: baixarDocumentoPublicado
      parameters: [{ $ref: '#/components/parameters/PublicacaoId' }]
      responses:
        '200':
          description: Documento imutável
          headers:
            ETag: { description: Hash do documento, schema: { type: string } }
          content: { application/pdf: { schema: { type: string, contentEncoding: binary } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/auditoria:
    get:
      tags: [Auditoria]
      summary: Consultar trilha administrativa autorizada
      operationId: consultarAuditoria
      security: [{ bearerAuth: [] }]
      parameters:
        - name: aggregateType
          in: query
          schema: { type: string }
        - name: aggregateId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Eventos permitidos ao ator, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A autenticação institucional será definida no planejamento de integração; cada operação ainda exige permissão contextual no backend.
  parameters:
    ProcessoId: { name: processoId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EditalId: { name: editalId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RetificacaoId: { name: retificacaoId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    PublicacaoId: { name: publicacaoId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    VersaoId: { name: versaoId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: ETag da revisão esperada }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  headers:
    ETag: { description: Revisão do agregado, schema: { type: string } }
    Location: { description: URI do recurso imutável criado, schema: { type: string, format: uri-reference } }
  responses:
    Forbidden: { description: Acesso negado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Recurso inexistente ou não revelado ao ator, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Estado, idempotência ou concorrência incompatível, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed: { description: ETag obsoleto, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionRequired: { description: If-Match obrigatório, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: Invariante ou validação semântica violada, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NoEffectiveVersion: { description: Não havia versão vigente no instante, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Id: { type: string, format: uuid }
    CriarProcessoRequest:
      type: object
      required: [institutionalCode, title, firstEdital]
      properties:
        institutionalCode: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        firstEdital: { $ref: '#/components/schemas/CriarEditalRequest' }
    CriarEditalRequest:
      type: object
      required: [number, year, title]
      properties:
        number: { type: string, minLength: 1 }
        year: { type: integer, minimum: 2000 }
        title: { type: string, minLength: 1 }
        description: { type: string }
    EditalDraftRequest:
      type: object
      required: [profiles, schedule]
      properties:
        profiles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PerfilInput' } }
        schedule: { type: array, items: { $ref: '#/components/schemas/EventoInput' } }
        editorialContent: { type: object, additionalProperties: true }
    PerfilInput:
      type: object
      required: [id, code, name, immediateVacancies, reserveType]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        immediateVacancies: { type: integer, minimum: 0 }
        reserveType: { type: string, enum: [NONE, LIMITED, UNLIMITED] }
        reserveLimit: { type: [integer, 'null'], minimum: 0 }
        competitionModalities: { type: array, items: { type: object } }
    EventoInput:
      type: object
      required: [id, type, description, startAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string }
        description: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: [string, 'null'], format: date-time }
        order: { type: integer, minimum: 0 }
    AtoAdministrativoRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    MotivoRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    HomologacaoRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    CancelamentoRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    PublicacaoRequest:
      type: object
      additionalProperties: false
      required: [signatory]
      properties:
        signatory: { $ref: '#/components/schemas/SignatorySnapshot' }
        reason: { type: string, minLength: 1 }
    SignatorySnapshot:
      type: object
      additionalProperties: false
      required: [authorityId, name, role]
      properties:
        authorityId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
    CriarRetificacaoRequest:
      type: object
      required: [baseSnapshotId, justification, changes]
      properties:
        baseSnapshotId: { $ref: '#/components/schemas/Id' }
        justification: { type: string, minLength: 1 }
        effectiveAt: { type: [string, 'null'], format: date-time }
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NormativeChange' }
    AtualizarRetificacaoRequest:
      type: object
      required: [justification, changes]
      properties:
        justification: { type: string, minLength: 1 }
        effectiveAt: { type: [string, 'null'], format: date-time }
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NormativeChange' }
    NormativeChange:
      type: object
      required: [targetPath, operation, newValue]
      properties:
        targetPath: { type: string, description: Caminho canônico com chaves estáveis }
        operation: { type: string, enum: [ADD, REPLACE, REMOVE] }
        expectedPreviousHash:
          type: string
          description: >-
            Hash canônico do conteúdo em targetPath conhecido na elaboração. Quando informado,
            é verificado na criação e na edição contra a versão base e, na Publicação, contra o
            conteúdo vigente no início de vigência; divergência responde 409 expected_hash_mismatch.
        newValue: {}
    ProcessoResponse:
      type: object
      required: [id, institutionalCode, status, revision]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        institutionalCode: { type: string }
        status: { type: string, enum: [EM_ELABORACAO, ATIVO, ENCERRADO, CANCELADO] }
        revision: { type: integer, format: int64 }
    EditalAdminResponse:
      type: object
      required: [id, processoId, status, revision]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        processoId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [EM_ELABORACAO, EM_REVISAO, HOMOLOGADO, PUBLICADO, ENCERRADO, CANCELADO] }
        revision: { type: integer, format: int64 }
        validationFindings: { type: array, items: { $ref: '#/components/schemas/ValidationFinding' } }
    RetificacaoResponse:
      type: object
      required: [id, editalId, status, effectiveAt, revision]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        editalId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [EM_ELABORACAO, EM_REVISAO, HOMOLOGADA, PUBLICADA, CANCELADA] }
        effectiveAt: { type: [string, 'null'], format: date-time }
        revision: { type: integer, format: int64 }
    PublicacaoResponse:
      type: object
      required: [id, editalId, publicationOrder, publishedAt, effectiveAt, contentHash, documentHash]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        editalId: { $ref: '#/components/schemas/Id' }
        publicationOrder: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time }
        effectiveAt: { type: string, format: date-time }
        contentHash: { type: string }
        documentHash: { type: string }
    PublicacaoDetalheResponse:
      allOf:
        - $ref: '#/components/schemas/PublicacaoResponse'
        - type: object
          required: [sourceType, sourceId, signatory, content, documentUrl]
          properties:
            sourceType: { type: string, enum: [EDITAL, RETIFICACAO] }
            sourceId: { $ref: '#/components/schemas/Id' }
            signatory: { $ref: '#/components/schemas/SignatorySnapshot' }
            content: { type: object, additionalProperties: true }
            documentUrl: { type: string, format: uri-reference }
    RetificacaoPublicaResponse:
      type: object
      additionalProperties: false
      required: [id, editalId, publicationId, justification, publishedAt, effectiveAt, changes]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        editalId: { $ref: '#/components/schemas/Id' }
        publicationId: { $ref: '#/components/schemas/Id' }
        justification: { type: string }
        publishedAt: { type: string, format: date-time }
        effectiveAt: { type: string, format: date-time }
        changes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/NormativeChange' } }
    VersaoConsolidadaResponse:
      type: object
      required: [id, editalId, validFrom, contentHash, content, appliedPublications]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        editalId: { $ref: '#/components/schemas/Id' }
        validFrom: { type: string, format: date-time }
        contentHash: { type: string }
        content: { type: object, additionalProperties: true }
        appliedPublications: { type: array, items: { $ref: '#/components/schemas/Id' } }
    HistoricoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/PublicacaoResponse'
              - $ref: '#/components/schemas/RetificacaoPublicaResponse'
              - $ref: '#/components/schemas/VersaoConsolidadaResponse'
        nextCursor: { type: [string, 'null'] }
    ValidationFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [INFO, WARNING, BLOCKING_ERROR] }
        code: { type: string }
        message: { type: string }
        path: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        violations: { type: array, items: { type: object } }
