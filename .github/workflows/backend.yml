name: Backend

# **`push` só na `main`, e é o que impede o trabalho em dobro.** Sem o filtro, todo commit de uma
# branch com PR aberto disparava esta suíte **duas vezes** — uma pelo `push`, outra pelo
# `pull_request` —, sobre o mesmo SHA e com o mesmo resultado. Eram ~54 minutos de runner por
# commit e quatro checks a ler, sendo dois deles cópia dos outros dois.
#
# O que se perde é a verificação de branch **sem PR**, e é perda aceitável: aqui todo trabalho entra
# por PR, e o merge na `main` continua verificado pelo `push` que este filtro preserva.
on:
  push:
    branches: [main]
  pull_request:

# **Run superada é cancelada, e só em PR.** Empurrar uma correção enquanto o CI roda deixava a run
# anterior seguir até o fim — 26 minutos verificando um commit que já não é o da branch. O grupo é
# por branch de origem, de modo que PRs diferentes não se cancelam.
#
# **A condição existe para proteger a `main`.** Ali o evento é `push`, e cancelar significaria
# deixar um commit da `main` sem verificação nenhuma quando dois merges caem perto. Em PR o
# cancelamento não perde nada: o que importa é o último commit, e é ele que fica.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # **Pelo espelho do Docker Hub, e não por ele.** O Docker Hub limita os downloads sem login
        # por IP, e o IP do runner é compartilhado: em 09/10/2026 o PR #270 caiu duas vezes seguidas
        # em `toomanyrequests` antes de rodar um teste sequer, com o código verde. O `mirror.gcr.io`
        # é o cache público do Docker Hub mantido pelo Google, serve a mesma imagem oficial e não
        # pede login. Serviço sobe antes de qualquer passo, e por isso o espelho vai no nome.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_DB: processo_seletivo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DB_ENGINE: postgresql
      DB_NAME: processo_seletivo_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      # O `check` não olha formatação: sem este passo a divergência cresce sem sinal —
      # foi assim que a árvore chegou a 101 arquivos fora de formato antes de alguém rodar
      # `ruff format` pela primeira vez.
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  # O ambiente containerizado é o caminho canônico de desenvolvimento, e caminho documentado que
  # ninguém executa apodrece calado. Este job é o que impede isso: ele sobe a mesma pilha que a
  # pessoa sobe na máquina dela, com o mesmo `.env.example`, e falha se ela não ficar utilizável.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As imagens da pilha — `postgres`, `mailpit` e a base `python` do `Dockerfile` — vêm do Docker
      # Hub, que limita o download sem login por IP (o `toomanyrequests` do PR #270, em 09/10/2026).
      # Elas são baixadas do espelho e marcadas com o nome de sempre: o `compose` só baixa imagem
      # que não há, e o build usa a base que já está no runner. Configurar o espelho no daemon não
      # bastou — na primeira falha dele o daemon voltava ao Docker Hub, e o `mailpit` caiu no limite.
      # O `compose.yaml` e o `Dockerfile` não mudam: a pilha que se testa é a que a pessoa sobe. A
      # lista abaixo repete as imagens deles; imagem trocada lá e esquecida aqui volta a vir do Docker
      # Hub, e o job continua certo — só volta a depender do limite.
      - name: Baixar as imagens do Docker Hub pelo espelho
        run: |
          for imagem in postgres:18 axllent/mailpit:latest python:3.13-slim-bookworm; do
            caminho=$([[ "$imagem" == */* ]] && echo "$imagem" || echo "library/$imagem")
            docker pull "mirror.gcr.io/$caminho"
            docker tag "mirror.gcr.io/$caminho" "$imagem"
          done

      # A cópia é o primeiro passo do README. Se ela deixar de bastar — variável nova exigida e não
      # acrescentada ao exemplo —, é aqui que aparece, e não no primeiro dia de quem chega.
      - name: Preparar o backend/.env a partir do exemplo
        run: cp backend/.env.example backend/.env

      # `--wait` só devolve quando o healthcheck de cada serviço passa, e o do `app` é o
      # `/readiness`, que responde 503 se o banco não responder **ou** se houver migration
      # pendente. Subir sem erro já prova provisionamento, migração e conexão pela role de runtime.
      - name: Subir a pilha
        run: docker compose up --build --detach --wait --wait-timeout 300

      # A segunda passada do `provisionar_papeis` é a que concede privilégio sobre as tabelas que
      # as migrations acabaram de criar. `0 de N` significa que ela não rodou, e o sistema sobe
      # igual — a imutabilidade é que fica só com a camada da trigger.
      - name: Conferir que a segunda passada trancou as tabelas
        run: docker compose logs app | grep -E "[1-9][0-9]* de [0-9]+ tabelas append-only"

      - name: Conferir que as superfícies respondem
        run: |
          curl -fsS -o /dev/null http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/readiness
          curl -fsS -o /dev/null -L http://localhost:8000/gestao/
          curl -fsS -o /dev/null http://localhost:8000/selecoes/
          # O coletor de e-mail: sem ele o código de acesso do portal volta a existir só no log.
          curl -fsS -o /dev/null http://localhost:8025/

      - name: Logs, se algo falhou
        if: failure()
        run: docker compose logs

      - name: Derrubar
        if: always()
        run: docker compose down --volumes
