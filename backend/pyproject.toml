[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processo-seletivo-cefor"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "psycopg[binary]>=3.2,<3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6.2,<7",
  "ruff>=0.14.14,<0.15",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["processo_seletivo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# Conexão não fechada é vazamento silencioso: em teste vira ruído atribuído ao caso seguinte,
# e no processo servidor vira descritor pendurado. Falhar é o que impede a volta. O segundo
# filtro é o que de fato pega: o warning nasce no coletor de lixo, fora de qualquer frame, e o
# pytest o reembrulha em PytestUnraisableExceptionWarning antes de reportá-lo.
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "acceptance: cenários de aceitação rastreados",
  "contract: conformidade HTTP/OpenAPI",
  "integration: integração com persistência",
  "authorization: autorização contextual e anti-IDOR",
  "performance: custo de consulta e escalabilidade",
]

[tool.coverage.run]
branch = true
source = ["processo_seletivo"]
# A `0006` reconstruía a precondição das Retificações elaboradas antes de ela existir, com uma
# cópia congelada da regra do domínio. A `0008` removeu a coluna que metade dessa cópia
# preenchia, e o sistema nunca chegou a produção: numa base nova a migration percorre zero
# linhas. Ela é história append-only que não pode ser apagada e não pode mais rodar sobre dado.
# Medir sua cobertura não diria nada sobre a qualidade do que ainda executa.
omit = ["processo_seletivo/publicacoes/migrations/0006_backfill_precondicoes.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

