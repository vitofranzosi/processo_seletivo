<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Libras, com foto em círculo de três pessoas sentadas conversando em Libras. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Informática na Educação na modalidade EaD (DEMONSTRAÇÃO). Edital publicado. Consulte as condições na página oficial. 160 vagas em 4 opções. Polo Bom Jesus do Norte — 480 horas: 40 vagas. Polo Iúna — 480 horas: 40 vagas. Polo São Mateus — 480 horas: 40 vagas. Polo Vargem Alta — 480 horas: 40 vagas. Acesse o link na bio, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
