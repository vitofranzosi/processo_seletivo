<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Libras, com foto em círculo de três pessoas sentadas conversando em Libras. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Práticas Pedagógicas para a Educação Profissional e Tecnológica na Rede Federal. Inscrições até 30/10/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. Especialização em Informática na Educação — Polo Bom Jesus do Norte — 360 horas: 40 vagas. Acesse o link na bio, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
