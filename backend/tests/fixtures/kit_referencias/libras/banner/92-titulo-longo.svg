<text x="405" y="137" font-family="Inter" font-size="28" font-weight="700" fill="#000000" text-anchor="middle" data-campo="titulo_sem_numero">Seleção de cadastro de reserva de tutores</text>
<text x="405" y="177" font-family="Inter" font-size="28" font-weight="700" fill="#000000" text-anchor="middle" data-campo="titulo_sem_numero">presenciais e a distância para atuarem nos cursos</text>
<text x="405" y="217" font-family="Inter" font-size="28" font-weight="700" fill="#000000" text-anchor="middle" data-campo="titulo_sem_numero">técnicos e de pós-graduação do Programa</text>
<text x="405" y="256" font-family="Inter" font-size="28" font-weight="700" fill="#000000" text-anchor="middle" data-campo="titulo_sem_numero">Universidade Aberta do Brasil (UAB) ofertados</text>
<text x="405" y="296" font-family="Inter" font-size="28" font-weight="700" fill="#000000" text-anchor="middle" data-campo="titulo_sem_numero">pelo Cefor/Ifes (DEMONSTRAÇÃO)</text>
<text x="405" y="370" font-family="Unbounded" font-size="40" font-weight="700" fill="#000000" text-anchor="middle" data-campo="identificacao">Edital nº 92/2026</text>
