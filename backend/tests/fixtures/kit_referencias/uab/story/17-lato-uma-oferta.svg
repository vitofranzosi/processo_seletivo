<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade UAB/bolsista, com foto de um homem sorridente, de fone de ouvido, diante do notebook. Seleção de bolsista. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Práticas Pedagógicas para a Educação Profissional e Tecnológica na Rede Federal. Inscrições até 30/10/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. Acesse o link na bio, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
