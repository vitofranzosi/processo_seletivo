<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Aperfeiçoamento, com foto de uma mulher sorridente, de blazer, digitando diante do computador. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Informática na Educação na modalidade EaD (DEMONSTRAÇÃO). Prazo prorrogado. Inscrições até 04/11/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. 165 vagas em 4 opções. Polo Bom Jesus do Norte — 480 horas: 45 vagas. Polo Iúna — 480 horas: 40 vagas. Polo São Mateus — 480 horas: 40 vagas. Polo Vargem Alta — 480 horas: 40 vagas. Acesse o link na bio, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
