<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Aperfeiçoamento, com foto de uma mulher sorridente, de blazer, digitando diante do computador. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Práticas Pedagógicas para a Educação Profissional e Tecnológica na Rede Federal. Inscrições até 30/10/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. Especialização em Informática na Educação — Polo Bom Jesus do Norte — 360 horas: 40 vagas. Acesse o link na bio, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
