<text x="250" y="134" font-family="Lexend" font-size="28" font-weight="800" fill="#ffffff" data-campo="titulo_sem_numero">e a distância para atuarem nos cursos técnicos e de</text>
<text x="250" y="174" font-family="Lexend" font-size="28" font-weight="800" fill="#ffffff" data-campo="titulo_sem_numero">pós-graduação do Programa Universidade Aberta do</text>
<text x="250" y="213" font-family="Lexend" font-size="28" font-weight="800" fill="#ffffff" data-campo="titulo_sem_numero">Brasil (UAB) ofertados pelo Cefor/Ifes</text>
<text x="250" y="253" font-family="Lexend" font-size="28" font-weight="800" fill="#ffffff" data-campo="titulo_sem_numero">(DEMONSTRAÇÃO)</text>
