<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, com a Marca do Instituto Federal do Espírito Santo, Centro de Referência em Formação e em Educação a Distância. Processo seletivo, Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Informática na Educação na modalidade EaD (DEMONSTRAÇÃO). Inscrições de 13/10 a 30/10/2026, até as 23h59 (horário de Brasília). Oferta: Especialização em Informática na Educação, 80 vagas em 2 opções. Polo Bom Jesus do Norte: 40 vagas. Especialização em Informática na Educação: 40 vagas. Condições, documentos e cronograma: gps.exemplo.ifes.edu.br/selecoes, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
