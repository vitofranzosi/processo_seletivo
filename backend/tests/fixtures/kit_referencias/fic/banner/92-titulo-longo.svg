<title id="titulo">Edital nº 92/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade FIC, com ilustração de uma estudante sorridente estudando ao notebook, numa mesa com livros. Edital nº 92/2026: Seleção de Tutores UAB — Cadastro de Reserva 2026 (DEMONSTRAÇÃO). Inscrições até 28/10/2026, às 23h59 (horário de Brasília). Início em 14/10/2026. 18 opções; confira todas na página oficial. Acesse o edital, busque por 92/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
