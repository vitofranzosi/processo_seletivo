<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade FIC, com ilustração de uma estudante sorridente estudando ao notebook, numa mesa com livros. Edital nº 91/2026: Cursos de Formação Inicial e Continuada (DEMONSTRAÇÃO). Inscrições até 30/10/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. 120 vagas em 3 opções. Assistente Administrativo — 180h: 40 vagas. Assistente de Secretaria Escolar — 180h: 40 vagas. Inglês Básico — 60h: 40 vagas. Acesse o link na bio, busque por 91/2026 – Cefor. Dúvidas? selecaoextensao.cefor@ifes.edu.br, (27) 3198-0925 (seg. a sex., das 8h às 16h). Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
