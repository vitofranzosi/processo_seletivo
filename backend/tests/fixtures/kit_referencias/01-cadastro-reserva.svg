<title id="titulo">Edital nº 01/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, com a Marca do Instituto Federal do Espírito Santo, Centro de Referência em Formação e em Educação a Distância. Processo seletivo, Edital nº 01/2026: Professor Substituto e Técnico-Administrativo. Inscrições de 11/10 a 31/10/2026, até as 09h43 (horário de Brasília). Oferta: Professor de Informática — Campus Serra: 2 vagas e cadastro reserva. Técnico de Laboratório — Campus Vitória: cadastro reserva. Condições, documentos e cronograma: gps.exemplo.ifes.edu.br/selecoes, busque por 01/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
