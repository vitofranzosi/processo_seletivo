<title id="titulo">Edital nº 01/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade TMD. Edital nº 01/2026: Professor Substituto e Técnico-Administrativo. Inscrições até 31/10/2026, às 09h43 (horário de Brasília). Início em 11/10/2026. Professor de Informática — Campus Serra: 2 vagas e cadastro reserva. Técnico de Laboratório — Campus Vitória: cadastro reserva. Acesse o link na bio, busque por 01/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
