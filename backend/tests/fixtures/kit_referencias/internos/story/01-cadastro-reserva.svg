<title id="titulo">Edital nº 01/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Internos, com fotos em losango de uma servidora sorridente ao computador, de uma colega com um tablet e de uma sala de trabalho com computadores. Seleção para servidores. Edital nº 01/2026: Professor Substituto e Técnico-Administrativo. Inscrições até 31/10/2026, às 09h43 (horário de Brasília). Início em 11/10/2026. Acesse o link na bio, busque por 01/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
