<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Edital nº 91/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Internos, com fotos em losango de uma servidora sorridente ao computador, de uma colega com um tablet e de uma sala de trabalho com computadores. Seleção para servidores. Edital nº 91/2026: Curso de Pós-graduação Lato Sensu em Informática na Educação na modalidade EaD (DEMONSTRAÇÃO). Inscrições até 30/10/2026, às 23h59 (horário de Brasília). Início em 13/10/2026. Acesse o edital, busque por 91/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
