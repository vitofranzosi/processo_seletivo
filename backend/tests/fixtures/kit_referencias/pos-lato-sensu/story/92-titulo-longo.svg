<title id="titulo">Edital nº 92/2026 — material de divulgação</title>
<desc id="descricao">Peça de divulgação do Cefor/Ifes, na identidade Pós Lato Sensu, com foto de uma estudante sorridente, de fone de ouvido, escrevendo diante do notebook. Edital nº 92/2026: Seleção de cadastro de reserva de tutores presenciais e a distância para atuarem nos cursos técnicos e de pós-graduação do Programa Universidade Aberta do Brasil (UAB) ofertados pelo Cefor/Ifes (DEMONSTRAÇÃO). Inscrições até 28/10/2026, às 23h59 (horário de Brasília). Início em 14/10/2026. 18 opções; confira todas na página oficial. Acesse o link na bio, busque por 92/2026 – Cefor. Versão vigente desde 08/10/2026, ref. IMPRESSAO.</desc>
