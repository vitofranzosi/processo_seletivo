{% load estaticos %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% comment %} O htmx, ao carregar, injeta um `<style>` com as regras do indicador de carregamento — que
   nenhuma tela usa —, e pode avaliar texto de atributo como código — que nenhuma tela escreve. A
   política de segurança de conteúdo recusaria os dois. Esta configuração os desliga sem script
   embutido: o htmx a lê do `<meta>` ao iniciar (091, D-009). {% endcomment %}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<title>{% block titulo %}Seleções abertas{% endblock %} — Cefor/Ifes</title>
<link rel="stylesheet" href="{% estatico 'shared/tokens.css' %}">
{% comment %} A folha do portal está em `portal/static/portal/portal.css` desde a 092: fora do documento,
   ela fica no cache, e a política de segurança de conteúdo pode recusar estilo embutido no portal.
   {% endcomment %}
<link rel="stylesheet" href="{% estatico 'portal/portal.css' %}">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <span class="marca"><a href="{% url 'portal:vitrine' %}">Cefor<span>/Ifes</span> · <span class="nome-por-extenso">Gestão de Processos Seletivos</span><span class="sigla" aria-hidden="true">GPS</span></a></span>
  <nav class="acessos" aria-label="Acessos">
  {% comment %}
  A identidade aqui é a **do candidato**, de chave de sessão própria — nunca o `ator` da interface
  administrativa, que é outro eixo (FR-020, FR-021).

  E ela aparece por uma razão prática: sem `Sair`, quem se identificasse num computador
  compartilhado — laboratório, lan house, biblioteca — ficava identificado, e a pessoa seguinte
  começava a inscrição dela com o CPF de quem estava antes.
  {% endcomment %}
  {% comment %}
  A porta de entrada. Sem ela, quem já se inscreveu e volta para conferir não tinha por onde: a
  vitrine não oferecia "Entrar", e o único caminho para a área era clicar em "Inscrever-se nesta
  vaga" numa vaga qualquer — ou saber o endereço de cor. Com sessão, o link leva ao lugar onde a
  pessoa quer chegar; sem sessão, à porta. As telas do próprio acesso não repetem o convite.
  {% endcomment %}
  {% if candidato %}
  <span class="quem-esta">
    <a class="no-topo" href="{% url 'portal:inscricoes' %}">Minhas inscrições</a>
  {% comment %}
  Quem acabou de entrar pela primeira vez ainda não tem nome: ele só é pedido na primeira
  inscrição. O endereço identifica a pessoa para ela mesma até lá — e um cabeçalho vazio deixaria
  a dúvida de se ela está mesmo dentro.
  {% endcomment %}
    <span class="nome">{{ candidato.nome|default:candidato.email }}</span>
    <form method="post" action="{% url 'portal:sair' %}">
      {% csrf_token %}
      <button type="submit" class="sair">Sair</button>
    </form>
  </span>
  {% else %}
  {% comment %}
  Bloco, e não variável de contexto: as telas do próprio acesso o esvaziam declarando
  `{% block convite_de_entrar %}{% endblock %}`, e nenhuma view precisa lembrar de passar bandeira.
  Ele fica fora do `{% if candidato %}` porque, quando há sessão, o cabeçalho já leva à área.
  {% endcomment %}
  {% block convite_de_entrar %}
  <span class="quem-esta">
    <a class="no-topo" href="{% url 'portal:acesso' %}">Minhas inscrições</a>
  </span>
  {% endblock %}
  {% endif %}
  {% comment %}
  A porta da gestão, **só onde há por onde entrar nela** (075, `FR-1699`, decisão do responsável
  pelo produto em 16/10). Em produção, enquanto a autenticação institucional não existe, ela levaria
  a uma página que não deixa entrar — e o candidato não tem por que vê-la.
  {% endcomment %}
  {% if metodos_de_acesso %}<a class="porta-da-gestao" href="{% url 'interface:lista' %}">Área de gestão</a>{% endif %}
  </nav>
</header>
<main id="conteudo" tabindex="-1">
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
