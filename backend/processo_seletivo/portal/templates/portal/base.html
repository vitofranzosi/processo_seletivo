<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Seleções abertas{% endblock %} — Cefor/Ifes</title>
<style>
{% include "shared/_tokens.css.html" %}
/* A base do candidato é escrita para o celular primeiro, e alarga depois. É o inverso da base
   administrativa, que nasceu para uma tela larga e não tem nenhuma consulta de mídia: quem
   elabora um Edital está sentado; quem se inscreve, não necessariamente (FR-079). */
*{box-sizing:border-box}
body{margin:0;font-family:"Open Sans","Segoe UI",system-ui,sans-serif;color:var(--texto);
  background:var(--fundo);line-height:1.6;font-size:16px}
a{color:var(--verde-texto)}
/* Herdado da base administrativa, e não reinventado: link de salto, foco visível e alvo do
   salto capaz de receber o foco. Vale para os dois canais porque a exigência é a mesma. */
.pular{position:absolute;left:-9999px;top:0;background:var(--branco);padding:.75rem 1rem;z-index:10}
.pular:focus{left:0}
*:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
main:focus{outline:none}
header.topo{background:var(--verde-escuro);color:var(--branco);padding:.85rem 1rem}
header.topo a{color:var(--branco);text-decoration:none}
header.topo .marca{font-weight:600;letter-spacing:.02em;font-size:1rem}
header.topo .marca span{font-weight:300;opacity:.85}
main{max-width:820px;margin:0 auto;padding:1rem}
h1{font-size:1.4rem;margin:0 0 .25rem;font-weight:600;line-height:1.3}
h2{font-size:1.1rem;margin:1.75rem 0 .5rem;font-weight:600}
h3{font-size:1rem;margin:0 0 .35rem;font-weight:600}
.sub{color:var(--texto-fraco);margin:0 0 1.5rem}
/* Sem `width` fixa e sem tabela em nenhum ponto: é o que sustenta 375px sem rolagem
   horizontal. Números longos e códigos ganham quebra explícita mais abaixo. */
.selecoes{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.selecao{background:var(--branco);border:1px solid var(--borda);border-radius:6px;
  padding:1rem;display:grid;gap:.35rem}
.selecao a.titulo{font-weight:600;font-size:1.05rem;text-decoration:none}
.selecao a.titulo:hover{text-decoration:underline}
.selecao .meta{color:var(--texto-fraco);font-size:.9375rem;overflow-wrap:anywhere}
.perfis{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.perfil{background:var(--branco);border:1px solid var(--borda);border-radius:6px;padding:1rem}
.perfil dl{margin:.5rem 0 0;display:grid;grid-template-columns:1fr;gap:.25rem .75rem;
  font-size:.9375rem}
.perfil dt{color:var(--texto-fraco)}
.perfil dd{margin:0}
.requisitos{margin:.5rem 0 0;padding-left:1.25rem}
.documento{display:inline-block;margin-top:.5rem;padding:.6rem 1rem;border-radius:4px;
  background:var(--verde);color:var(--branco);text-decoration:none;font-weight:600}
.documento:hover{background:var(--verde-escuro)}
.vazio{background:var(--branco);border:1px dashed var(--borda);border-radius:6px;padding:1.5rem;
  color:var(--texto-fraco)}
/* A situação é a informação que decide se vale continuar lendo, e por isso tem peso próprio.
   Cor **e** palavra: quem não distingue as cores lê a mesma coisa (WCAG 1.4.1). */
.situacao{margin:.5rem 0;font-weight:600}
.situacao.aberto{color:var(--sucesso)}
.situacao.futuro{color:var(--amarelo)}
.situacao.encerrado{color:var(--texto-fraco);font-weight:400}
.aviso{background:var(--amarelo-fundo);border-left:4px solid var(--amarelo);padding:.75rem 1rem;
  margin-bottom:1.5rem;border-radius:0 4px 4px 0}
.erro{background:var(--vermelho-fundo);border-left:4px solid var(--vermelho);padding:.75rem 1rem;
  margin-bottom:1rem;border-radius:0 4px 4px 0}
.recusa{display:block;color:var(--vermelho);font-size:.9375rem;margin-top:.25rem}
.obrigatorio{color:var(--vermelho);margin-left:.15rem}
.campo{display:grid;gap:.35rem;margin:0 0 1rem;max-width:32rem}
.campo label{font-weight:600}
.campo input,.campo select{width:100%;padding:.6rem;border:1px solid var(--borda);border-radius:4px;
  font-size:1rem;font-family:inherit}
.ajuda{color:var(--texto-fraco);font-size:.9375rem;margin:.25rem 0 1rem}
.dados{display:grid;grid-template-columns:1fr;gap:.15rem .75rem;margin:0 0 1rem}
.dados dt{color:var(--texto-fraco)}
.dados dd{margin:0 0 .5rem;overflow-wrap:anywhere}
button.principal{padding:.75rem 1.25rem;border:0;border-radius:4px;background:var(--verde);
  color:var(--branco);font-weight:600;font-size:1rem;font-family:inherit;cursor:pointer;
  width:100%;max-width:32rem}
button.principal:hover{background:var(--verde-escuro)}
form.convite{margin:.75rem 0 0}
@media (min-width:600px){
  main{padding:1.5rem}
  h1{font-size:1.6rem}
  .perfil dl{grid-template-columns:auto 1fr}
  .dados{grid-template-columns:auto 1fr}
  button.principal{width:auto}
}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <span class="marca"><a href="{% url 'portal:vitrine' %}">Cefor<span>/Ifes</span> · Seleções</a></span>
</header>
<!-- Nada de identidade neste cabeçalho: na entrega 1 o canal é anônimo, e a sessão do candidato
     é outro eixo, com chave própria (FR-020, FR-021). O processador de contexto da interface
     administrativa injeta `ator` em todo template, inclusive neste — e é por isso que nenhuma
     página do portal o lê. -->
<main id="conteudo" tabindex="-1">
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
