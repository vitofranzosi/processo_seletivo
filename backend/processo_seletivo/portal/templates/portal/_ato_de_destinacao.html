<li class="ato-de-destinacao">
  <p class="frase-da-destinacao">{{ item.frase }}</p>
  <dl class="dados-da-destinacao">
    <dt>De</dt><dd>{{ item.origem }}</dd>
    <dt>Para</dt><dd>{{ item.destino }}</dd>
    <dt>Quantidade</dt><dd>{{ item.quantidade }}</dd>
    <dt>Fundamento</dt><dd>{{ item.fundamento }}</dd>
  </dl>
</li>
