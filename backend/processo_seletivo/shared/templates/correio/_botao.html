O botão da ação, e o endereço por extenso logo abaixo dele. **Largura total no celular, sem media
query** (a guarda da CSP não deixa o modelo ter `<style>`): a tabela é fluida até 340 px, e a área de
texto de um celular é mais estreita que isso; no computador ele fica com 340 px, à esquerda. O
Outlook do Windows não lê largura máxima, e a tabela de 340 px entre comentários condicionais é só
para ele. O link é bloco, e o toque vale no botão inteiro, e não só no texto.

O endereço por extenso vem logo abaixo: quem não consegue tocar no botão — o
Outlook que bloqueou o link, o leitor de tela que pulou a tabela — copia o endereço. Um só por
mensagem; o rótulo é um verbo que diz para onde leva.
