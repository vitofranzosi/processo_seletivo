# As Novidades do GPS (spec 168). Uma tabela [[nota]] por capacidade entregue, da mais recente para a
# mais antiga. O guia de curadoria está em doc/curadoria-das-novidades.md; leia-o antes de escrever.
#
# Campos obrigatórios: id, data, categoria, titulo, resumo, prs, specs.
#   data       — o dia em que o último PR citado entrou na main (horário de Brasília), sem aspas.
#   categoria  — "novidade", "melhoria" ou "correcao".
#   prs, specs — rastreabilidade; nunca aparecem na página.
# Opcionais: beneficio, onde, passos, destino (rota da barra), documentacao (âncora da Documentação do
#   Sistema, sem #), requer_configuracao (configuração booleana), para_capacidade (quem lê: uma
#   capacidade ou uma lista delas, e basta uma).
#
# A regra que não se negocia: uma nota só entra depois de TODOS os PRs que ela cita estarem na main,
# e descreve só o que eles entregaram. É o que garante que nenhum ambiente anuncie o que não roda.

# ---- novembro de 2026 ----------------------------------------------------------------------------

[[nota]]
id = "etapa-por-modalidade-e-deliberacao"
data = 2026-11-14
categoria = "novidade"
titulo = "Etapa só para algumas Modalidades, e decidida por pareceres da comissão"
resumo = """
A Etapa pode alcançar só as inscrições de algumas Modalidades — como a verificação da autodeclaração
—, e quem não é alcançado a atravessa. A Etapa restrita declara o efeito do resultado desfavorável:
por padrão, a pessoa deixa de concorrer pela reserva e continua na ampla. E a Etapa com mais de uma
avaliação por inscrição declara a regra de deliberação — maioria ou unanimidade —, com cada parecer
dado às cegas.
"""
beneficio = "A verificação feita por banca passa a ser conduzida e registrada no GPS, com a regra publicada no Edital."
onde = "Na composição do Edital, no cartão da Etapa: a quem ela se aplica e como a comissão chega ao resultado."
documentacao = "deliberacao"
prs = [542, 543, 545]
specs = ["163", "164", "165"]

