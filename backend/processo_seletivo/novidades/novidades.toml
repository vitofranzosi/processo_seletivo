# As Novidades do GPS (spec 168). Uma tabela [[nota]] por capacidade entregue, da mais recente para a
# mais antiga. O guia de curadoria está em doc/curadoria-das-novidades.md; leia-o antes de escrever.
#
# Campos obrigatórios: id, data, categoria, titulo, resumo, prs, specs.
#   data       — o dia em que o último PR citado entrou na main (horário de Brasília), sem aspas.
#   categoria  — "novidade", "melhoria" ou "correcao".
#   prs, specs — rastreabilidade; nunca aparecem na página.
# Opcionais: beneficio, onde, passos, destino (rota da barra), documentacao (âncora da Documentação do
#   Sistema, sem #), requer_configuracao (configuração booleana), para_capacidade (quem lê).
#
# A regra que não se negocia: uma nota só entra depois de TODOS os PRs que ela cita estarem na main,
# e descreve só o que eles entregaram. É o que garante que nenhum ambiente anuncie o que não roda.

# ---- novembro de 2026 ------------------------------------------------------------------------

