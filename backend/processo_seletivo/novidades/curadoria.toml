# O registro da curadoria das Novidades do GPS (spec 168). Não vai para a página.
#
# A curadoria cobre todo PR mergeado na main desde `inicio`. Cada um deles termina num de três
# lugares, e o roteiro `scripts/rascunhar_novidades.py` lista como pendente o que não estiver em
# nenhum:
#   1. citado por uma nota de novidades.toml;
#   2. listado aqui, em [[sem_nota]], com o motivo;
#   3. só de documentação (spec, estudo, auditoria, guia) — o roteiro o reconhece pelos arquivos.
#
# O corte é pela data do merge, e não pelo número do PR: o número diz quando o PR foi aberto, e um PR
# antigo pode entrar na main depois de um novo. Na conferência de 14/11, 55 dos 249 PRs da janela
# entraram fora da ordem do número.

inicio = 2026-09-15

