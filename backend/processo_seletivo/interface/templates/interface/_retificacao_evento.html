<fieldset class="linha evento-novo" id="cartao-novo-evento-{{ indice }}"{% if na_proposta %} data-na-proposta{% endif %}>
  <legend><span class="nome">Evento a acrescentar</span>{% if na_proposta %} <span class="na-proposta">na proposta</span>{% endif %}</legend>
  <div class="campos">
    {% for campo in campos %}
    <p class="campo{% if campo.tipo == 'instante' %} curto{% endif %}">
      <label for="ne-{{ indice }}-{{ campo.chave }}">{{ campo.rotulo }}</label>
      <input id="ne-{{ indice }}-{{ campo.chave }}" name="novo-evento-{{ indice }}-{{ campo.chave }}"
             type="{% if campo.tipo == 'instante' %}datetime-local{% else %}text{% endif %}"
             value="{{ campo.valor }}">
    </p>
    {% endfor %}
  </div>
  <p class="acoes-linha">
    <button type="button" class="acao" hx-get="{% url 'interface:fragmento-remover' %}"
            hx-target="closest fieldset" hx-swap="outerHTML">Não acrescentar este Evento</button>
  </p>
</fieldset>
