{% load interface_extras static estaticos %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% comment %} O htmx, ao carregar, injeta um `<style>` com as regras do indicador de carregamento — que
   nenhuma tela usa —, e pode avaliar texto de atributo como código — que nenhuma tela escreve. A
   política de segurança de conteúdo recusaria os dois. Esta configuração os desliga sem script
   embutido: o htmx a lê do `<meta>` ao iniciar (091, D-009). {% endcomment %}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<title>{% block titulo %}Gestão de Processos Seletivos{% endblock %} — {{ identificacao_da_gestao.rotulo }}</title>
{% comment %}
A folha comum saiu deste modelo para `interface/gestao.css`, e os tokens para `shared/tokens.css` (089):
dentro do HTML, 53 KB de regras viajavam em toda resposta da gestão, sem cache, e impediam uma política
de segurança de conteúdo. A ordem é a da cascata de antes — tokens, folha comum, estilo da página — e o
`?v=` muda quando o arquivo muda (`shared/estaticos.py`). Desde a 091 a folha comum são sete arquivos
por área, em `interface/gestao/`, e `{% folhas_da_gestao %}` escreve um `<link>` para cada um, na ordem
de `FOLHAS_DA_GESTAO` — vários `<link>`, e não um arquivo que importa os outros (D-002 da 091).
{% endcomment %}
<link rel="stylesheet" href="{% estatico 'shared/tokens.css' %}">
{% folhas_da_gestao %}
{% comment %}
**O estilo daquela página, e não de todas** (040).

Nasceu porque a `040` acrescentou 4 KB de folha que só uma tela usa, e eles passaram a viajar em
toda página da gestão: a tela de distribuição — que já estava a **488 bytes** do teto que
`tests/performance/test_escala_da_mesa.py` prende — estourou por 3533. O guardião fez o trabalho
dele, e a resposta certa era escopar, não levantar o teto.

**A explicação de cada regra mora com a regra**, em `visao_geral.html`. Aqui fica só o ponto de
extensão: prosa dentro de `<style>` é bytes na rede, e foi a segunda vez que esse mesmo teto
reclamou — da primeira, deste comentário.

**Quem preencher este bloco continua sob a regra das larguras.** `tests/interface/test_larguras.py`
lê a folha **renderizada**, e há um caso que lê a da Visão Geral justamente para que estilo nenhum
escape do guardião por mudar de lugar.

**Desde a 091, o bloco carrega arquivos, e não regras.** Cada tela põe aqui o `<link>` do estilo
dela — `interface/telas/<tela>.css`, e o do grupo de telas que divide as mesmas regras,
`interface/grupos/<grupo>.css` —, pela tag `estatico`. O motivo da `040` continua o mesmo: o arquivo
de uma tela só viaja para ela. E o de agora: sem `<style>` no documento, a política de segurança de
conteúdo recusa estilo embutido. A prosa sobre "bytes na rede", acima, era de quando o comentário
viajava dentro do `<style>`; o argumento de escopar o estilo vale igual.
{% endcomment %}
{% block estilo_da_pagina %}{% endblock %}
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
{% if navegacao.barra %}
<div class="shell{% if navegacao.no_topo %} shell-barra-no-topo{% endif %}">
{% comment %} Sem `defer` e aqui dentro, de propósito: o script põe o estado da barra na `.shell`
   antes de ela ser desenhada (`FR-1728`). Na Alocação a barra fica no topo, e a preferência não
   vale (`FR-1730`). {% endcomment %}
{% if not navegacao.no_topo %}<script src="{% static 'interface/shell.js' %}"></script>{% endif %}
<svg class="simbolos" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-pasta" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-prancheta" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12.5l2 2 4-4"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M3 20h18M7 16v-5M12 16V6M17 16v-8"/></symbol>
  <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/></symbol>
  <symbol id="i-predio" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></symbol>
  <symbol id="i-envelope" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-livro" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2zM12 6.5v13"/></symbol>
  <symbol id="i-chave" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
  <symbol id="i-escudo" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-sair" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></symbol>
  <symbol id="i-painel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
</svg>
<div class="barra-lateral">
  <div class="marca-da-barra">
    {% comment %} A marca leva à lista de Processos. Sem isso a Visão Geral era um beco: nenhum link
       dela devolve à lista, e o único caminho de volta era o botão do navegador. {% endcomment %}
    <a class="marca" href="{% url 'interface:lista' %}"><span class="sigla-do-produto" aria-hidden="true">GPS</span><span class="nome-do-produto">Gestão de Processos Seletivos<span>{{ identificacao_da_gestao.rotulo }}</span></span></a>
  </div>
  <button type="button" class="abrir-secoes" popovertarget="secoes-da-gestao">Seções</button>
  <div class="secoes-da-gestao" id="secoes-da-gestao" popover>
    <button type="button" class="fechar-secoes" popovertarget="secoes-da-gestao" popovertargetaction="hide">Fechar</button>
    {% comment %} Cada item só vem para quem o destino aceita (076, `FR-1714`): os predicados são
       os da lista, em `navegacao.py`. Grupo sem item não vem. {% endcomment %}
    <nav aria-label="Seções da gestão">
      {% for grupo in navegacao.barra %}
      <p class="grupo-de-secoes" id="grupo-de-secoes-{{ forloop.counter }}">{{ grupo.nome }}</p>
      <ul aria-labelledby="grupo-de-secoes-{{ forloop.counter }}">
        {% for item in grupo.itens %}<li><a href="{{ item.endereco }}"{% if item.atual %} aria-current="{{ item.atual }}"{% endif %}><svg class="icone-da-secao" aria-hidden="true"><use href="#{{ item.icone }}"/></svg><span class="rotulo-da-secao">{{ item.rotulo }}</span></a></li>
        {% endfor %}
      </ul>
      {% endfor %}
    </nav>
    <div class="pessoa-identificada">
      {% comment %} O nome, e não o identificador (107, `FR-3103`): na demonstração eles são o mesmo
         texto, e no institucional o identificador é `pessoa-<uuid>`, que ninguém lê. {% endcomment %}
      <span class="iniciais" aria-hidden="true" title="{{ nome_do_ator }}">{{ navegacao.iniciais }}</span>
      <span class="nome-da-pessoa"><strong>{{ nome_do_ator }}</strong>{% if papeis_do_ator %}<span>{{ papeis_do_ator|join:", " }}</span>{% endif %}</span>
      <form method="post" action="{% url 'interface:sair' %}">
        {% csrf_token %}
        <button type="submit" class="acao"><svg class="icone-da-secao" aria-hidden="true"><use href="#i-sair"/></svg><span class="rotulo-da-secao">Sair</span></button>
      </form>
    </div>
    {% comment %} A unidade ativa da pessoa institucional, e a troca, quando há mais de um escopo
       (107, `FR-3104`). A demonstração não tem escopos: o bloco não existe para ela. Formulário
       comum, sem script — a troca é um POST, e a página seguinte já vem com as permissões da
       escolhida. {% endcomment %}
    {% if escopos_do_ator %}
    <div class="unidade-ativa">
      {% if escopos_do_ator|length > 1 %}
      <form method="post" action="{% url 'interface:unidade-ativa' %}">
        {% csrf_token %}
        <label for="unidade-ativa">Atuando em</label>
        <select id="unidade-ativa" name="unidade">
          {% for escopo in escopos_do_ator %}<option value="{{ escopo.codigo }}"{% if escopo.ativo %} selected{% endif %}>{{ escopo.rotulo }}</option>{% endfor %}
        </select>
        <button type="submit" class="acao">Trocar</button>
      </form>
      {% else %}
      <p>Atuando em <strong>{% for escopo in escopos_do_ator %}{{ escopo.rotulo }}{% endfor %}</strong></p>
      {% endif %}
    </div>
    {% endif %}
    {% comment %} Escondido até o script ligá-lo: sem script, recolher não teria como ser lembrado,
       e a barra fica expandida (`FR-1729`). Na última linha, presa ao fundo: é o único lugar da
       barra que não se mexe ao recolher. {% endcomment %}
    <button type="button" class="alternar-barra" data-alternar-barra hidden><svg class="icone-da-secao" aria-hidden="true"><use href="#i-painel"/></svg><span class="rotulo-da-secao" data-rotulo>Recolher a barra lateral</span></button>
  </div>
</div>
<div class="area-de-trabalho">
<header class="cabecalho-de-contexto">
  {% comment %} O caminho para na seção (076, `FR-1718`), e é texto, e não navegação: o link da seção
     já está na barra, e o Processo, o Edital e a Etapa estão na trilha que a própria tela traz.
     Como link, a seção aparecia três vezes seguidas — barra, caminho, trilha — para quem
     percorre os marcos de navegação. {% endcomment %}
  {% comment %} As telas de uso diário sobrescrevem o bloco com a própria trilha, que sai do conteúdo
     delas (077, `FR-1746`, `R-001`): uma trilha por página, e só a tela sabe dizê-la — o nome da
     Etapa, o protocolo, a porta por onde se chegou. As demais ficam com o caminho até a seção. {% endcomment %}
  {% block caminho_do_contexto %}<p class="caminho-da-secao">{% include "interface/_produto_na_trilha.html" %} {{ navegacao.secao_atual }}</p>{% endblock %}
  <a href="{% url 'interface:identificar' %}">Trocar identidade</a>
</header>
{% else %}
<header class="topo">
  <a class="marca" href="{% url 'interface:lista' %}">{% include "_marca_da_unidade.html" with identificacao=identificacao_da_gestao %} · Gestão de Processos Seletivos</a>
</header>
{% endif %}
<!-- tabindex="-1": sem ele o link de salto move a rolagem mas não o foco, que fica no
     BODY — e a próxima tabulação volta ao cabeçalho, que é exatamente o que o link
     existe para pular (WCAG 2.4.1). Verificador automatizado não pega: ele só
     confere que o link e o alvo existem. -->
<main id="conteudo" tabindex="-1">
{% block conteudo %}{% endblock %}
</main>
{% if navegacao.barra %}
</div>
</div>
{% endif %}
</body>
</html>
