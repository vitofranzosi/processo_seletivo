# ── Estados que a fixture não reproduz igual ─────────────────────────────────────────────────────
#
# Os estados montados sobre a desistência da cotista (`pela_desistencia`, da `155`) partem de um
# sorteio, e a ordem do sorteio sai dos identificadores das inscrições, que mudam a cada montagem:
# duas fotografias do mesmo código deram 0 e 1 ocupadas na ampla concorrência (15/11, no R-10 e no
# R-09). O que esses estados existem para mostrar é da lista reservada, e a ampla sai da comparação
# deles. Os outros recortes, e as ações deles, continuam comparados. O passo seguinte ("Próximo nesta
# lista") também sai, porque é a fila da ampla que ele aponta.

