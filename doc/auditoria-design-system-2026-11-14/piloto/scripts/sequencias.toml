# As sequências que não se invertem (172, seção "As sequências declaradas" da spec).
#
# Cada termo é uma lista: um bloco pertence ao termo se casa com algum item dela. `=texto` é o
# texto inteiro do bloco, `.classe` uma classe dele, `<tag>` a etiqueta, `item:x` um trecho do item
# da estrutura que o contém, e o resto é trecho contido no texto. O casamento exato existe porque o
# trecho solto achava o rótulo "Fundamento da homologação" também dentro da recusa que o cita.
# A sequência vale onde os dois termos existem; todo bloco de `antes` precede todo bloco de
# `depois`, na ordem do documento e na visual. `escopo` diz se ela vale na página ou dentro de cada
# recorte (a `section` rotulada) ou de cada Processo (o `article`).
#
# Os trechos são do texto dos templates em 15/11/2026. Mudou o texto? Mudou a spec da tela, e
# este arquivo acompanha.

# ── Em todas as cinco telas ─────────────────────────────────────────────────────────────────────

# A T-S1 da spec (a trilha antes do título) não se confere aqui: a trilha é da moldura, fora do
# `main` que o inventário lê, e o piloto não toca a moldura (FR-7702).

[[sequencia]]
id = "T-S2"
telas = ["confirmacao", "ocupacao", "conferencia"]
antes = [".erro"]
depois = ["<form>", "<label>", "<button>"]

[[sequencia]]
id = "T-S3"
telas = ["confirmacao"]
antes = ["Impedimento:"]
depois = ["Atenção:", "Nenhuma pendência registrada no GPS impede"]

