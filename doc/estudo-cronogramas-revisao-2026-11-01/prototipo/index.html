<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Cronogramas · POCs</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="estudo.css">
  <script src="dados.js" defer></script>
  <script src="estudo.js" defer></script>
</head>
<body>
  <a class="pular" href="#painel">Pular para os cronogramas</a>
  <main>
    <p class="selo">Estudo de UX · POC local · dados de demonstração e de teste</p>
    <h1>Cronogramas dos Editais</h1>
    <p class="sub" id="proveniencia"></p>

    <nav class="alternativas" aria-label="Alternativas do estudo">
      <a id="link-c" href="?visao=c"><strong>C</strong> Faixa por Edital</a>
      <a id="link-a" href="?visao=a"><strong>A</strong> Gantt por evento</a>
      <a id="link-b" href="?visao=b"><strong>B</strong> Timeline em cartões</a>
      <a href="atual-mes.html">Atual · Mês</a>
      <a href="atual-proximos.html">Atual · Próximos</a>
    </nav>

    <details class="filtros" id="filtros"><summary>Cenário e filtros <span id="recorte"></span></summary>
    <form id="controles" class="controles" method="get" aria-label="Cenário e filtros">
      <input type="hidden" name="visao" id="visao">
      <input type="hidden" name="mes" id="mes">
      <label>Cenário
        <select name="cenario" id="cenario">
          <option value="denso">23 Editais (7 do banco demo + 16 de teste)</option>
          <option value="demo">7 Editais do banco demo</option>
          <option value="sucessao">Um Edital com etapas sucessivas (T03)</option>
          <option value="retificacao">Edital retificado (106)</option>
        </select></label>
      <label>Referência
        <select name="referencia" id="referencia">
          <option value="2026-11-01">01/11/2026, 12h</option>
          <option value="2026-11-05">05/11/2026, 12h (após a Retificação do 106)</option>
        </select></label>
      <label>Espécie
        <select name="especie" id="especie">
          <option value="">Todas</option>
          <option value="inscricoes">Período de inscrições</option>
          <option value="etapa">Ligado a uma Etapa</option>
          <option value="demais">Demais Eventos</option>
        </select></label>
      <label>Fase na referência
        <select name="fase" id="fase">
          <option value="">Todas</option>
          <option value="em_curso">Em curso, pelo cronograma</option>
          <option value="por_vir">Ainda não começou</option>
          <option value="passada">Data passada</option>
        </select></label>
      <label id="rotulo-ordem">Ordem
        <select name="ordem" id="ordem">
          <option value="proximo">Pelo próximo marco</option>
          <option value="numero">Pelo número</option>
        </select></label>
      <p class="acoes"><button type="submit">Aplicar</button> <a id="limpar" href="?">Limpar</a></p>
    </form></details>

    <div id="aviso" class="aviso" hidden></div>

    <section class="visualizacao" aria-labelledby="titulo-mes">
      <div class="barra-mes">
        <div><p class="sobretitulo" id="nome-alternativa"></p><h2 id="titulo-mes"></h2></div>
        <nav aria-label="Navegar entre meses"><a id="anterior" aria-label="Mês anterior">←</a> <a id="hoje">Mês da referência</a> <a id="seguinte" aria-label="Mês seguinte">→</a></nav>
      </div>
      <p id="legenda" class="legenda"></p>
      <p id="resultado" class="resultado" role="status"></p>
      <div id="painel" tabindex="-1"></div>
    </section>
  </main>
  <dialog id="detalhes" aria-labelledby="titulo-detalhe">
    <form method="dialog"><button class="fechar">Fechar</button></form>
    <p class="sobretitulo" id="origem-detalhe"></p>
    <h2 id="titulo-detalhe"></h2>
    <div id="corpo-detalhe"></div>
  </dialog>
  <noscript><p>Ative JavaScript para ver as POCs; as capturas estão na pasta do estudo.</p></noscript>
</body>
</html>
